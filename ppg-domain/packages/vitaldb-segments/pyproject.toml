[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vitaldb-segments"
version = "0.1.0"
description = "Audited VitalDB window reading and selection"
requires-python = ">=3.11"
dependencies = ["ppg-runkit", "numpy", "scipy", "pandas", "pyarrow"]

[project.scripts]
vitaldb-segments = "vitaldb_segments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest"]

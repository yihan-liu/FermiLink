[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ppg-models"
version = "0.1.0"
description = "ART-to-area model ladder, observation operator and fitting"
requires-python = ">=3.11"
dependencies = ["ppg-transfer", "peripheral-ppg", "numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openbf-walls"
version = "0.1.0"
description = "PWDB-network simulations with an adapted openBF solver"
requires-python = ">=3.11"
dependencies = ["ppg-runkit", "pwdb", "numpy"]

[project.scripts]
openbf-walls = "openbf_walls.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openbf_walls = ["julia/*.jl"]

[project.optional-dependencies]
test = ["pytest"]

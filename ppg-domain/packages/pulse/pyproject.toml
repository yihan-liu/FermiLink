[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[project]
name = "pulse"
version = "0.1.0"
requires-python = ">=3.10"
[project.scripts]
pulse = "pulse_physiology.cli:main"
pulse-physiology = "pulse_physiology.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

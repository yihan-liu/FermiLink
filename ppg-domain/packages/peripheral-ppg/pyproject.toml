[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "peripheral-ppg"
version = "0.1.0"
description = "Explicit-assumption peripheral PPG models"
requires-python = ">=3.10"

[project.scripts]
peripheral-ppg = "peripheral_ppg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

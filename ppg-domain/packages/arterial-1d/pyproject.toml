[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arterial-1d"
version = "0.1.0"
description = "PWDB radial-pressure to digital-area network simulations"
requires-python = ">=3.11"
dependencies = ["ppg-forward>=0.1.0", "numpy", "scipy", "matplotlib"]

[project.scripts]
arterial-1d = "arterial_1d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arterial_1d = ["julia/*.jl"]

[project.optional-dependencies]
test = ["pytest"]
